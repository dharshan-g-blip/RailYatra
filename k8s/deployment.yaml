apiVersion: apps/v1
kind: Deployment
metadata:
  name: railyatra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: railyatra
  template:
    metadata:
      labels:
        app: railyatra
    spec:
      containers:
        - name: railyatra
          image: railyatra-app:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: railyatra-service
spec:
  type: NodePort
  selector:
    app: railyatra
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30008